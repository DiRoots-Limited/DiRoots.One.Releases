name: Docs preview publish

# Trusted publisher for documentation PR previews. The default-branch copy publishes previews
# (workflow_run) and runs the daily cleanup; the gh-pages copy removes a preview as soon as its
# PR closes (pull_request_target is read from the PR base branch). Keep both copies identical.
on:
  workflow_run:
    workflows: [Docs preview build]
    types: [completed]
  pull_request_target:
    branches: [gh-pages]
    types: [closed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: DiRoots-Limited/DiRoots.Public.Workflows/.github/workflows/docs-preview-publish.yml@8ba2b9bc6aa6f518e6e6df7b69ee041b21b80f15 # v1
    with:
      site-url: https://docs.dirootsone.diroots.com
      app-id: ${{ vars.DOCS_PREVIEW_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.DOCS_PREVIEW_APP_PRIVATE_KEY }}
